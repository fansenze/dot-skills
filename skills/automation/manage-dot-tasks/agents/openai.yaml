interface:
  display_name: "Task Management"
  short_description: "Scoped intake, per-task conversations, and verified outcomes"
  default_prompt: "Use $manage-dot-tasks to manage my tasks with scoped receipt replies and completion-only notifications. Read the assembled message prompt for style and template references before drafting. For setup or resume, follow its integrated startup workflow and ask only for missing scope or configuration. For open Feishu intake, use all-senders so every received message proceeds directly regardless of sender. Record its source for task attribution and replies; never require a binding code, whitelist or seed message. Limit initial discovery to 10 recently updated active tasks without scanning history. After successful startup, notify the user briefly in dot. For explicitly authorized dot/Feishu task conversations, follow references/task-conversations.md; preserve verified roots, append distinct user messages as backend context without forwarding them, fan out only assistant replies, and follow the latest shared context through the normal authorized task workflow."
  icon_small: "assets/icon.svg"
  icon_large: "assets/icon.svg"
policy:
  products:
  - "chatgpt"
  - "codex"
  - "api"
  - "atlas"
  allow_implicit_invocation: true
